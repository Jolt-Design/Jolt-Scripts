name: Publish to npm

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

# Uses npm Trusted Publishing (OIDC), so no npm token secret is needed
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      - name: Enable Corepack
        run: npm install -g corepack

      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")

          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Lint
        run: corepack yarn run biome ci

      - name: Build
        run: corepack yarn run build

      - name: Test
        run: corepack yarn run test:run

      - name: Publish
        run: corepack yarn npm publish --provenance --tolerate-republish
